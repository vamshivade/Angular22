<div class="mx-auto p-6 w-11/12">
  <h1 class="text-2xl font-semibold text-gray-800 mb-6">Settings</h1>

  <!-- Account Settings -->
  <div class="bg-white rounded-lg shadow p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Account Settings</h2>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600 mb-1"> Name </label>
      <input
        type="text"
        placeholder="Enter your name"
        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1"> Email </label>
      <input
        type="email"
        placeholder="Enter your email"
        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
  </div>

  <!-- Preferences -->
  <div class="bg-white rounded-lg shadow p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Preferences</h2>

    <div class="flex items-center justify-between py-3 border-b">
      <div>
        <p class="font-medium text-gray-700">Email Notifications</p>
        <p class="text-sm text-gray-500">Receive notifications by email</p>
      </div>

      <input type="checkbox" class="w-5 h-5" />
    </div>

    <div class="flex items-center justify-between py-3">
      <div>
        <p class="font-medium text-gray-700">Dark Mode</p>
        <p class="text-sm text-gray-500">Enable dark mode</p>
      </div>

      <input type="checkbox" class="w-5 h-5" />
    </div>
  </div>

  <!-- Save Button -->
  <button class="bg-blue-600 text-white px-5 py-2 rounded-md hover:bg-blue-700 transition">
    Save Changes
  </button>
</div>
