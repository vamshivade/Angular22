<div class="min-h-[90vh] bg-gray-100 px-6 py-10">
  <div class="mx-auto max-w-6xl">
    <h1 class="text-3xl font-bold text-gray-800">Products</h1>

    <p class="mt-2 text-gray-600">Select a product to view its details.</p>

    <!-- Products -->
    <div class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (product of products; track product.id) {
        <div class="rounded-xl bg-white p-6 shadow transition hover:-translate-y-1 hover:shadow-lg">
          <h2 class="text-xl font-semibold text-gray-800">{{ product.name }}</h2>

          <p class="mt-2 text-gray-600">{{ product.description }}</p>

          <p class="mt-4 text-lg font-bold text-blue-600">₹ {{ product.price }}</p>

          <!-- <a
            [routerLink]="['/pages/products', product.id]"
            class="mt-5 inline-block rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700"
          >
            View Details
          </a> -->

          <a
            (click)="viewDetails(product.id, product.name, product.price)"
            class="mt-5 inline-block rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700"
          >
            View Details
          </a>
        </div>
      }
    </div>
  </div>
</div>
