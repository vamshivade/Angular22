<div class="mx-auto p-6 w-11/12">
  <h1 class="text-2xl font-semibold text-gray-800 mb-6">Profile</h1>

  <!-- Profile Card -->
  <div class="bg-white rounded-lg shadow p-6 mb-6">

    <!-- User Info -->
    <div class="flex items-center gap-5 mb-6">
      <div
        class="w-20 h-20 rounded-full bg-blue-600 text-white
               flex items-center justify-center text-2xl font-semibold"
      >
        V
      </div>

      <div>
        <h2 class="text-xl font-semibold text-gray-800">
          Vamshi
        </h2>

        <p class="text-sm text-gray-500">
          vamshi@gmail.com
        </p>
      </div>
    </div>

    <!-- Personal Information -->
    <h2 class="text-lg font-semibold text-gray-700 mb-4">
      Personal Information
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

      <!-- Name -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Full Name
        </label>

        <input
          type="text"
          value="Vamshi"
          class="w-full border border-gray-300 rounded-md
                 px-3 py-2 focus:outline-none
                 focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Email
        </label>

        <input
          type="email"
          value="vamshi@gmail.com"
          class="w-full border border-gray-300 rounded-md
                 px-3 py-2 focus:outline-none
                 focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Phone -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Phone
        </label>

        <input
          type="text"
          placeholder="Enter phone number"
          class="w-full border border-gray-300 rounded-md
                 px-3 py-2 focus:outline-none
                 focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Location -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Location
        </label>

        <input
          type="text"
          placeholder="Enter location"
          class="w-full border border-gray-300 rounded-md
                 px-3 py-2 focus:outline-none
                 focus:ring-2 focus:ring-blue-500"
        />
      </div>

    </div>

    <!-- Save Button -->
    <div class="mt-6">
      <button
        class="bg-blue-600 text-white px-5 py-2 rounded-md
               hover:bg-blue-700 transition"
      >
        Update Profile
      </button>
    </div>

  </div>

  <!-- Account Information -->
  <div class="bg-white rounded-lg shadow p-6">

    <h2 class="text-lg font-semibold text-gray-700 mb-4">
      Account Information
    </h2>

    <div class="space-y-4">

      <div class="flex justify-between border-b pb-3">
        <span class="text-sm text-gray-500">
          Account Status
        </span>

        <span
          class="px-3 py-1 text-xs font-medium
                 text-green-700 bg-green-100 rounded-full"
        >
          Active
        </span>
      </div>

      <div class="flex justify-between border-b pb-3">
        <span class="text-sm text-gray-500">
          Member Since
        </span>

        <span class="text-sm text-gray-700">
          September 2026
        </span>
      </div>

      <div class="flex justify-between">
        <span class="text-sm text-gray-500">
          Role
        </span>

        <span class="text-sm text-gray-700">
          User
        </span>
      </div>

    </div>

  </div>
</div>
