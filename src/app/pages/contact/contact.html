<div class="min-h-[90vh] bg-gray-100 px-6 py-10">
  <div class="mx-auto max-w-4xl">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Contact Us</h1>

      <p class="mt-2 text-gray-600">Have a question? Feel free to get in touch with us.</p>
    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
      <!-- Contact Information -->
      <div class="rounded-xl bg-white p-6 shadow">
        <h2 class="text-xl font-semibold text-gray-800">Get in Touch</h2>

        <div class="mt-6 space-y-4 text-gray-600">
          <p>
            <span class="font-medium text-gray-800">Email:</span>
            support@example.com
          </p>

          <p>
            <span class="font-medium text-gray-800">Phone:</span>
            +91 98765 43210
          </p>

          <p>
            <span class="font-medium text-gray-800">Address:</span>
            Hyderabad, Telangana, India
          </p>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="rounded-xl bg-white p-6 shadow">
        <h2 class="text-xl font-semibold text-gray-800">Send a Message</h2>

        <form class="mt-6 space-y-4">
          <input
            type="text"
            placeholder="Your Name"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-blue-500"
          />

          <input
            type="email"
            placeholder="Your Email"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-blue-500"
          />

          <textarea
            rows="4"
            placeholder="Your Message"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-blue-500"
          ></textarea>

          <button
            type="submit"
            class="w-full rounded-lg bg-blue-600 px-4 py-3 font-medium text-white hover:bg-blue-700"
          >
            Send Message
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
