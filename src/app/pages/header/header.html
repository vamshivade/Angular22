<div class="p-3 px-5 bg-gray-300 w-full h-[10vh] flex items-center justify-between relative z-50">
  <div class="logo text-2xl font-semibold">Angular 22</div>
  
  <!-- Mobile Menu Button -->
  <button class="md:hidden p-2 focus:outline-none" (click)="toggleMenu()">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="isMenuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'"></path>
    </svg>
  </button>

  <!-- Navigation Menu -->
  <nav [class.hidden]="!isMenuOpen" class="absolute md:static top-[10vh] left-0 w-full md:w-auto bg-gray-300 md:bg-transparent md:flex md:items-center p-5 md:p-0 shadow-md md:shadow-none transition-all duration-300 ease-in-out">
    <ul class="flex flex-col md:flex-row items-center gap-6 md:gap-8">
      <li>
        <a
          [routerLink]="['/pages/home']"
          routerLinkActive="text-blue-600"
          [routerLinkActiveOptions]="{ exact: true }"
          class="block w-24 text-center text-xl font-semibold transition-colors hover:text-blue-500"
          (click)="isMenuOpen = false"
        >
          Home
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/pages/dashboard']"
          routerLinkActive="text-blue-600"
          class="block w-24 text-center text-xl font-semibold transition-colors hover:text-blue-500"
          (click)="isMenuOpen = false"
        >
          Dashboard
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/pages/about']"
          routerLinkActive="text-blue-600"
          class="block w-24 text-center text-xl font-semibold transition-colors hover:text-blue-500"
          (click)="isMenuOpen = false"
        >
          About
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/pages/contact']"
          routerLinkActive="text-blue-600"
          class="block w-24 text-center text-xl font-semibold transition-colors hover:text-blue-500"
          (click)="isMenuOpen = false"
        >
          Contact
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/pages/products']"
          routerLinkActive="text-blue-600"
          class="block w-24 text-center text-xl font-semibold transition-colors hover:text-blue-500"
          (click)="isMenuOpen = false"
        >
          Products
        </a>
      </li>
    </ul>
  </nav>
</div>
