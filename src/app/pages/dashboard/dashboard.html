<div class="h-full bg-gray-100 p-4 relative">
  <div class="flex h-full gap-4">
    <!-- Mobile Sidebar Backdrop -->
    @if (isSidebarOpen) {
      <div class="fixed inset-0 z-40 bg-black/50 md:hidden" (click)="toggleSidebar()"></div>
    }

    <!-- Sidebar -->
    <aside
      class="fixed inset-y-0 left-0 z-50 w-64 shrink-0 transform bg-white p-3 shadow-xl transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:shadow-sm"
      [class.-translate-x-full]="!isSidebarOpen"
      [class.translate-x-0]="isSidebarOpen"
    >
      <!-- Navigation -->
      <nav class="h-full flex flex-col">
        <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-gray-400">Menu</p>

        <ul class="space-y-2 flex-1">
          <!-- Dashboard -->
          <li>
            <a
              [routerLink]="['/pages/dashboard']"
              routerLinkActive="bg-blue-50 text-blue-600"
              [routerLinkActiveOptions]="{ exact: true }"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-gray-600 transition hover:bg-gray-100 hover:text-gray-900"
              (click)="isSidebarOpen = false"
            >
              <span class="text-lg"> 🏠 </span>

              <span class="font-medium"> Dashboard </span>
            </a>
          </li>

          <!-- Profile -->
          <li>
            <a
              [routerLink]="['/pages/dashboard/profile']"
              routerLinkActive="bg-blue-50 text-blue-600"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-gray-600 transition hover:bg-gray-100 hover:text-gray-900"
              (click)="isSidebarOpen = false"
            >
              <span class="text-lg"> 👤 </span>

              <span class="font-medium"> Profile </span>
            </a>
          </li>

          <!-- Settings -->
          <li>
            <a
              [routerLink]="['/pages/dashboard/settings']"
              routerLinkActive="bg-blue-50 text-blue-600"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-gray-600 transition hover:bg-gray-100 hover:text-gray-900"
              (click)="isSidebarOpen = false"
            >
              <span class="text-lg"> ⚙️ </span>

              <span class="font-medium"> Settings </span>
            </a>
          </li>

          <!-- Orders -->
          <li>
            <a
              [routerLink]="['/pages/dashboard/orders']"
              routerLinkActive="bg-blue-50 text-blue-600"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-gray-600 transition hover:bg-gray-100 hover:text-gray-900"
              (click)="isSidebarOpen = false"
            >
              <span class="text-lg"> 📦 </span>

              <span class="font-medium"> Orders </span>
            </a>
          </li>
        </ul>

        <!-- Bottom Section -->
        <div class="border-t border-gray-200 pt-4">
          <button
            class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-gray-600 transition hover:bg-red-50 hover:text-red-600"
          >
            <span class="text-lg"> 🚪 </span>

            <span class="font-medium" [routerLink]="['/login']"> Logout </span>
          </button>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="min-w-0 flex-1 rounded-2xl bg-white shadow-sm overflow-hidden flex flex-col">
      <!-- Mobile Top Bar -->
      <div class="md:hidden flex items-center p-4 border-b border-gray-100">
        <button class="p-2 -ml-2 rounded-lg hover:bg-gray-100 focus:outline-none" (click)="toggleSidebar()">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <span class="ml-2 font-semibold text-gray-800">Dashboard</span>
      </div>
      
      <div class="flex-1 overflow-y-auto">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
